version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: ledger_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: ledger_db
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ledger_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: ledger_api
    restart: always
    # Automatically reload if you make code changes while container is running
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    environment:
      # This exact URL matches the credentials set in the 'db' service above
      DATABASE_URL: postgresql://postgres:postgrespassword@db:5432/ledger_db
    volumes:
      # Syncs your local code to the container so you don't have to rebuild on every change
      - .:/app
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata: